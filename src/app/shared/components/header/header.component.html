<header class="header" appScrollChange scrollClass="scrolled"
        [scrollThreshold]=50>
  <div class="container">
    <app-header-logo></app-header-logo>
    <app-header-menu [isMenuOpen]="isMenuOpen" (menuClose)="closeMenu()"></app-header-menu>
    @if (isMobile()) {
      <app-header-toggle (click)="toggleMenu()"></app-header-toggle>
    }
  </div>
</header>
