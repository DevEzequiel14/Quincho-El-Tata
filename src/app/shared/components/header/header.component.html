<header class="header" appScrollChange scrollClass="scrolled" [scrollThreshold]="50">
  <div class="container">
    <app-header-logo></app-header-logo>
    <app-header-menu
      [isMenuOpen]="isMenuOpen"
      [isMobileView]="isMobile()"
      (menuClose)="closeMenu()"
    ></app-header-menu>
    @if (isMobile()) {
      <app-header-toggle
        [expanded]="isMenuOpen"
        (clickEvent)="toggleMenu()"
      ></app-header-toggle>
    }
  </div>
</header>
