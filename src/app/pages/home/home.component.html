<section class="header-animation">
  <div class="masthead" id="home" role="region" aria-label="Presentación">
    <img
      class="masthead__image"
      [src]="heroImage.src"
      alt=""
      [width]="heroImage.width"
      [height]="heroImage.height"
      fetchpriority="high"
      decoding="async"
      aria-hidden="true"
    />
    <div class="masthead__overlay" aria-hidden="true"></div>
    <div class="container px-4 px-lg-5 d-flex h-100 align-items-center justify-content-center">
      <div class="masthead__content text-center">
        <h1 class="masthead__title">{{ title }}</h1>
        <p class="masthead__lede">{{ subTitle }}</p>
        <div class="masthead__actions">
          <a
            class="btn btn-brand masthead__cta btn-lg fw-semibold"
            [href]="whatsAppUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            {{ primaryCta }}
          </a>
          <a class="btn masthead__cta-secondary btn-lg fw-semibold" href="#precios">
            {{ secondaryCta }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="about-section surface-night" id="about" appScrollAnimate>
  <app-about></app-about>
</section>

<section class="benefits-section surface-day" id="benefits" appScrollAnimate>
  <app-benefits></app-benefits>
</section>

<section class="gallery-section surface-night" id="galeria" appScrollAnimate>
  @defer (on viewport) {
    <app-gallery />
  } @placeholder {
    <div class="container py-5 text-center text-muted-on-night gallery-section__placeholder">
      Cargando el espacio...
    </div>
  }
</section>

<section class="pricing-section surface-day" id="precios" appScrollAnimate>
  <app-pricing></app-pricing>
</section>

<section class="contact-section surface-night" id="contact" appScrollAnimate>
  <app-contact></app-contact>
</section>

<section class="text-center surface-day location-section" id="location" appScrollAnimate>
  <app-location></app-location>
</section>

<app-whatsapp></app-whatsapp>

<app-footer></app-footer>
