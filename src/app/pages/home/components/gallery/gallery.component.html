<div class="container px-4 px-lg-5 py-5">
  <h2 class="text-center fw-bold mb-3">{{ title }}</h2>
  <p class="text-center lead mb-4">{{ description }}</p>

  @if (hasPlaceholders) {
    <p class="text-center small gallery-note mb-5" role="note">
      Algunas imágenes son provisionales hasta incorporar la galería fotográfica definitiva.
    </p>
  }

  <div class="row g-4">
    @for (image of images; track image.src) {
      <div class="col-sm-6 col-lg-4">
        <figure class="gallery-item m-0 h-100">
          <img
            [src]="image.src"
            [alt]="image.alt"
            [width]="image.width"
            [height]="image.height"
            class="img-fluid rounded shadow-sm w-100 gallery-item__image"
            loading="lazy"
            decoding="async"
          />
          <figcaption class="small mt-2 gallery-caption">{{ image.caption }}</figcaption>
        </figure>
      </div>
    }
  </div>
</div>
