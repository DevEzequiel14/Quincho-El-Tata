<div class="container px-4 px-lg-5 py-5">
  <h2 class="gallery-title text-center">{{ title }}</h2>
  <p class="gallery-lede text-center">{{ description }}</p>
  <p class="gallery-note text-center" role="note">{{ provisionalNote }}</p>

  <div class="gallery-grid">
    @for (image of images; track image.src) {
      <figure class="gallery-item">
        <img
          [src]="image.src"
          [alt]="image.alt"
          [width]="image.width"
          [height]="image.height"
          class="gallery-item__image"
          loading="lazy"
          decoding="async"
        />
        <figcaption class="gallery-item__caption">{{ image.caption }}</figcaption>
      </figure>
    }
  </div>

  <aside class="gallery-proof" aria-label="Más fotos del quincho">
    <p class="gallery-proof__text">
      Para ver el patio en uso, pedí el álbum actual por WhatsApp o mirá
      <a
        class="gallery-proof__ig"
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ instagramHandle }}
      </a>
      en Instagram.
    </p>
    <div class="gallery-proof__actions">
      <a
        class="gallery-proof__primary"
        [href]="whatsAppUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ whatsAppCta }}
      </a>
      <a
        class="gallery-proof__secondary"
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ instagramCta }}
      </a>
    </div>
  </aside>
</div>
