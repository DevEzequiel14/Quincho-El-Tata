<div class="container px-4 px-lg-5 py-5">
  <h2 class="gallery-title text-center">{{ title }}</h2>
  <p class="gallery-lede text-center">{{ description }}</p>

  <div class="gallery-grid">
    @for (image of images; track image.src) {
      <figure class="gallery-item">
        <img
          [src]="image.src"
          [alt]="image.alt"
          [width]="image.width"
          [height]="image.height"
          class="gallery-item__image"
          loading="lazy"
          decoding="async"
        />
        <figcaption class="gallery-item__caption">{{ image.caption }}</figcaption>
      </figure>
    }
  </div>

  <div class="gallery-cta text-center">
    <a
      class="btn btn-brand gallery-cta__btn btn-lg fw-semibold"
      [href]="morePhotosUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ morePhotosCta }}
    </a>
  </div>
</div>
