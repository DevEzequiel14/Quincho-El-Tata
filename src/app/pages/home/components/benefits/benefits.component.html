<div class="container px-4 px-lg-5">
  <header class="benefits-header text-center">
    <h2 class="benefits-header__title">{{ title }}</h2>
    <p class="benefits-header__lede">{{ lede }}</p>
  </header>

  <div class="benefits-feature">
    <img
      class="benefits-feature__image content-image"
      [src]="image.src"
      [alt]="image.alt"
      [width]="image.width"
      [height]="image.height"
      loading="lazy"
      decoding="async"
    />

    <div class="benefits-feature__body">
      <ul class="benefits-list list-unstyled">
        @for (item of essentials; track $index) {
          <li class="benefits-list__item">
            <i class="bi bi-check-lg benefits-list__icon" aria-hidden="true"></i>
            <span>{{ item }}</span>
          </li>
        }
      </ul>
    </div>
  </div>

  <details class="benefits-extras">
    <summary class="benefits-extras__summary">{{ extrasTitle }}</summary>
    <ul class="benefits-list list-unstyled benefits-extras__list">
      @for (item of extras; track $index) {
        <li class="benefits-list__item">
          <i class="bi bi-check-lg benefits-list__icon" aria-hidden="true"></i>
          <span>{{ item }}</span>
        </li>
      }
    </ul>
  </details>
</div>
