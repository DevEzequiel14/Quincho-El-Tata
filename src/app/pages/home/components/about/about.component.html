<section class="about py-5">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6 text-center text-lg-start mb-4 mb-lg-0">
        <h2 class="about__title mb-3">{{ title }}</h2>
        <p class="about__lede">{{ description }}</p>
        <a class="about__link" href="#benefits">{{ midLink }}</a>
      </div>
      <div class="col-lg-6">
        <img
          [src]="image.src"
          [alt]="image.alt"
          [width]="image.width"
          [height]="image.height"
          class="img-fluid img-responsive content-image about__image"
          loading="lazy"
          decoding="async"
        />
      </div>
    </div>
  </div>
</section>
